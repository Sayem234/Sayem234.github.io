<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE Resources Portal | University</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2c3e50;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light: #ecf0f1;
            --dark: #34495e;
            --border-radius: 8px;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
        }

        header {
            background: linear-gradient(to right, var(--secondary), var(--dark));
            color: white;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0,0 Q50,100 100,0 L100,100 0,100 Z" fill="rgba(255,255,255,0.1)"/></svg>');
            background-size: cover;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255,255,255,0.85);
            font-size: 16px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        .tab-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 50px;
            padding: 12px 24px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
            backdrop-filter: blur(5px);
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .tab-btn.active {
            background: var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .tab-content {
            padding: 25px;
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 25px;
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transform: translateY(-3px);
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            margin-bottom: 25px;
            color: var(--secondary);
            border-bottom: 2px solid var(--light);
            padding-bottom: 15px;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--dark);
        }

        select {
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: var(--border-radius);
            background: white;
            font-size: 16px;
            transition: var(--transition);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }

        select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
        }

        .loading-icon {
            margin-left: 10px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: var(--light);
            color: var(--dark);
        }

        .btn-secondary:hover {
            background: #d5dbdb;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #27ae60;
        }

        .search-results {
            position: relative;
        }

        .results-message {
            padding: 15px;
            background: #f9f9f9;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            text-align: center;
            color: var(--dark);
        }

        .file-list {
            list-style: none;
            margin-bottom: 25px;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: var(--transition);
        }

        .file-item:hover {
            background: #f8f9fa;
        }

        .file-icon {
            width: 40px;
            height: 40px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
            color: var(--primary);
        }

        .file-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .file-details {
            font-size: 14px;
            color: #777;
        }

        .file-actions {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .file-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .action-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #f1f2f6;
            border: none;
            color: var(--dark);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-btn:hover {
            background: var(--primary);
            color: white;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .telegram-btn {
            background: #0088cc;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
        }

        .telegram-btn:hover {
            background: #0077b6;
            transform: translateY(-2px);
        }

        .upload-area {
            border: 2px dashed #ddd;
            border-radius: var(--border-radius);
            padding: 40px 20px;
            text-align: center;
            margin: 25px 0;
            transition: var(--transition);
            background: #f9f9f9;
            cursor: pointer;
        }

        .upload-area.active {
            border-color: var(--primary);
            background: rgba(52, 152, 219, 0.05);
        }

        .upload-icon {
            font-size: 48px;
            color: #ddd;
            margin-bottom: 15px;
            transition: var(--transition);
        }

        .upload-area.active .upload-icon {
            color: var(--primary);
        }

        .upload-area h3 {
            margin-bottom: 10px;
            color: var(--dark);
        }

        .upload-area p {
            margin: 10px 0;
            color: #777;
        }

        .small {
            font-size: 14px;
            margin-top: 15px;
        }

        .file-input {
            display: none;
        }

        .file-preview {
            margin: 20px 0;
        }

        .preview-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: #f8f9fa;
            border-radius: var(--border-radius);
            margin-bottom: 10px;
        }

        .preview-icon {
            width: 36px;
            height: 36px;
            background: rgba(52, 152, 219, 0.1);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 16px;
            color: var(--primary);
        }

        .preview-name {
            flex: 1;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            font-size: 14px;
            color: #777;
            margin-right: 15px;
        }

        .remove-file {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e9ecef;
            border: none;
            color: #777;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .remove-file:hover {
            background: var(--danger);
            color: white;
        }

        .progress-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 25px 0;
            display: none;
        }

        .progress {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .status-message {
            margin: 15px 0;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        footer {
            background: var(--dark);
            color: rgba(255,255,255,0.8);
            text-align: center;
            padding: 15px;
            font-size: 14px;
        }
        .alert-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: var(--border-radius);
            color: white;
            font-weight: 600;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.4s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
                <div>
                    <h1>CSE Resources Portal</h1>
                    <p class="subtitle">Access a wide range of academic materials.</p>
                </div>
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-tab="search"><i class="fas fa-search"></i> Find Resources</button>
                <button class="tab-btn" data-tab="upload"><i class="fas fa-upload"></i> Upload Resources</button>
            </div>
        </header>

        <main>
            <div id="search" class="tab-content active">
                <div class="card">
                    <h2 class="card-title"><i class="fas fa-filter"></i> Filters</h2>
                    <div class="filters">
                        <div class="filter-group">
                            <label for="course-filter"><i class="fas fa-book"></i> Course</label>
                            <select id="course-filter">
                                <option value="">All Courses</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="semester-filter"><i class="fas fa-calendar-alt"></i> Semester</label>
                            <select id="semester-filter">
                                <option value="">All Semesters</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <label for="type-filter"><i class="fas fa-file-alt"></i> Type</label>
                            <select id="type-filter">
                                <option value="">All Types</option>
                            </select>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" id="search-btn"><i class="fas fa-search"></i> Search</button>
                        <button class="btn btn-secondary" id="reset-btn"><i class="fas fa-redo"></i> Reset</button>
                    </div>
                </div>

                <div class="card search-results">
                    <h2 class="card-title"><i class="fas fa-list-ul"></i> Results</h2>
                    <p class="results-message" id="results-message">No files found. Try a new search!</p>
                    <ul class="file-list" id="file-list">
                        <!-- File items will be dynamically inserted here -->
                    </ul>
                    <div class="btn-group">
                        <button class="btn telegram-btn" id="send-btn" disabled><i class="fab fa-telegram-plane"></i> Send to Telegram</button>
                        <button class="btn btn-secondary" id="select-all-btn"><i class="fas fa-check-double"></i> Select All</button>
                    </div>
                </div>
            </div>

            <div id="upload" class="tab-content">
                <div class="card">
                    <h2 class="card-title"><i class="fas fa-upload"></i> Upload Files</h2>
                    <div class="upload-area" id="upload-area">
                        <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                        <h3>Drag & Drop files here or</h3>
                        <button class="btn btn-primary" id="file-select-btn">Choose Files</button>
                        <p class="small">Max file size: 20MB</p>
                    </div>
                    <input type="file" id="file-input" multiple class="file-input">
                    <div class="file-preview" id="file-preview">
                        <!-- File previews will be dynamically inserted here -->
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-success" id="upload-btn" disabled><i class="fas fa-cloud-upload-alt"></i> Upload Files</button>
                        <button class="btn btn-secondary" id="cancel-upload-btn" disabled><i class="fas fa-times-circle"></i> Cancel</button>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2023 CSE Resources. All rights reserved.</p>
        </footer>
    </div>
    
    <script>
        // Use a function to show a custom toast message
        function showToast(message, type = 'success') {
            const alertBox = document.createElement('div');
            alertBox.textContent = message;
            alertBox.style.position = 'fixed';
            alertBox.style.bottom = '20px';
            alertBox.style.right = '20px';
            alertBox.style.padding = '15px 25px';
            alertBox.style.borderRadius = 'var(--border-radius)';
            alertBox.style.color = 'white';
            alertBox.style.fontWeight = '600';
            alertBox.style.zIndex = '1000';
            alertBox.style.boxShadow = '0 5px 15px rgba(0,0,0,0.2)';
            alertBox.style.transform = 'translateY(100px)';
            alertBox.style.opacity = '0';
            alertBox.style.transition = 'all 0.4s ease';

            if (type === 'error') {
                alertBox.style.background = 'var(--danger)';
            } else {
                alertBox.style.background = 'var(--success)';
            }
            
            document.body.appendChild(alertBox);

            // Animate in
            setTimeout(() => {
                alertBox.style.transform = 'translateY(0)';
                alertBox.style.opacity = '1';
            }, 10);

            // Remove after delay
            setTimeout(() => {
                alertBox.style.transform = 'translateY(100px)';
                alertBox.style.opacity = '0';
                setTimeout(() => {
                    document.body.removeChild(alertBox);
                }, 400);
            }, 3000);
        }

        // Dummy data for demonstration
        const fileData = [
            { id: 1, name: "Data Structures & Algorithms Cheat Sheet.pdf", size: "2.1 MB", course: "CSE201", semester: "3rd", type: "Lecture Note", url: "https://example.com/file1.pdf" },
            { id: 2, name: "Object-Oriented Programming I.pptx", size: "1.5 MB", course: "CSE202", semester: "3rd", type: "Slide", url: "https://example.com/file2.pptx" },
            { id: 3, name: "Database Systems Lab Report.docx", size: "0.8 MB", course: "CSE305", semester: "5th", type: "Lab Report", url: "https://example.com/file3.docx" },
            { id: 4, name: "Operating Systems Final Exam.pdf", size: "3.4 MB", course: "CSE301", semester: "5th", type: "Question Paper", url: "https://example.com/file4.pdf" },
        ];

        // Global variables for Telegram
        let botToken = "7616102961:AAHqU8SwIZtPCwmx34TqTbmgECHx1h0w4JI"; // IMPORTANT: Replace with your actual bot token
        let telegram_user_id = null;

        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.tab-btn');
            const tabContents = document.querySelectorAll('.tab-content');
            const fileList = document.getElementById('file-list');
            const resultsMessage = document.getElementById('results-message');
            const selectAllBtn = document.getElementById('select-all-btn');
            const sendBtn = document.getElementById('send-btn');
            const searchBtn = document.getElementById('search-btn');
            const resetBtn = document.getElementById('reset-btn');
            const courseFilter = document.getElementById('course-filter');
            const semesterFilter = document.getElementById('semester-filter');
            const typeFilter = document.getElementById('type-filter');

            // Telegram Web App Initialization
            if (window.Telegram && window.Telegram.WebApp) {
                const twaData = window.Telegram.WebApp;
                if (twaData.initDataUnsafe && twaData.initDataUnsafe.user) {
                    telegram_user_id = twaData.initDataUnsafe.user.id;
                    console.log("Telegram User ID:", telegram_user_id);
                }
            } else {
                console.warn("Telegram Web App not detected. File sending will not work.");
            }

            // Tab functionality
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(content => content.classList.remove('active'));
                    tab.classList.add('active');
                    document.getElementById(tab.dataset.tab).classList.add('active');
                });
            });

            // Populate filters and display files
            function populateFiltersAndDisplayFiles(files) {
                const courses = [...new Set(files.map(file => file.course))];
                const semesters = [...new Set(files.map(file => file.semester))];
                const types = [...new Set(files.map(file => file.type))];

                function populateSelect(selectElement, items) {
                    selectElement.innerHTML = `<option value="">All ${selectElement.id.split('-')[0]}s</option>`;
                    items.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item;
                        option.textContent = item;
                        selectElement.appendChild(option);
                    });
                }
                
                populateSelect(courseFilter, courses);
                populateSelect(semesterFilter, semesters);
                populateSelect(typeFilter, types);
                displayFiles(files);
            }

            // Display files
            function displayFiles(files) {
                fileList.innerHTML = '';
                if (files.length === 0) {
                    resultsMessage.textContent = "No files found. Try a new search!";
                    resultsMessage.style.display = 'block';
                    sendBtn.disabled = true;
                } else {
                    resultsMessage.style.display = 'none';
                    files.forEach(file => {
                        const fileItem = document.createElement('li');
                        fileItem.className = 'file-item';
                        fileItem.innerHTML = `
                            <div class="file-icon"><i class="fas fa-file-alt"></i></div>
                            <div class="file-info">
                                <div class="file-name">${file.name}</div>
                                <div class="file-details">${file.size} - ${file.course} (${file.semester})</div>
                            </div>
                            <div class="file-actions">
                                <input type="checkbox" class="file-checkbox" data-url="${file.url}" data-name="${file.name}">
                            </div>
                        `;
                        fileList.appendChild(fileItem);
                    });
                    sendBtn.disabled = false;
                }
            }
            
            // Initial call
            populateFiltersAndDisplayFiles(fileData);

            // Filter and search
            function filterFiles() {
                const selectedCourse = courseFilter.value;
                const selectedSemester = semesterFilter.value;
                const selectedType = typeFilter.value;

                const filtered = fileData.filter(file => {
                    const courseMatch = selectedCourse === '' || file.course === selectedCourse;
                    const semesterMatch = selectedSemester === '' || file.semester === selectedSemester;
                    const typeMatch = selectedType === '' || file.type === selectedType;
                    return courseMatch && semesterMatch && typeMatch;
                });
                displayFiles(filtered);
            }
            
            searchBtn.addEventListener('click', filterFiles);
            resetBtn.addEventListener('click', () => {
                courseFilter.value = '';
                semesterFilter.value = '';
                typeFilter.value = '';
                displayFiles(fileData);
            });

            // Select All functionality
            selectAllBtn.addEventListener('click', () => {
                const checkboxes = document.querySelectorAll('.file-checkbox');
                const allSelected = Array.from(checkboxes).every(cb => cb.checked);
                checkboxes.forEach(cb => cb.checked = !allSelected);
                sendBtn.disabled = !document.querySelectorAll('.file-checkbox:checked').length;
            });
            
            fileList.addEventListener('change', (e) => {
                if (e.target.classList.contains('file-checkbox')) {
                    sendBtn.disabled = !document.querySelectorAll('.file-checkbox:checked').length;
                }
            });

            // Send files to Telegram functionality
            async function sendFilesToTelegram() {
                if (!botToken || !telegram_user_id) {
                    showToast("⚠️ Missing Telegram bot token or user ID. Please configure.", "error");
                    return;
                }

                const selectedFiles = document.querySelectorAll('.file-item input[type="checkbox"]:checked');
                if (selectedFiles.length === 0) {
                    showToast("⚠️ Please select at least one file.", "error");
                    return;
                }

                sendBtn.textContent = "Sending...";
                let successCount = 0;
                let errorCount = 0;
                const largeFileLimit = 20 * 1024 * 1024; // 20 MB

                for (const fileCheckbox of selectedFiles) {
                    const fileUrl = fileCheckbox.dataset.url;
                    const fileName = fileCheckbox.dataset.name;

                    // Note: file size check is just a placeholder here, as we don't have the size from the URL directly.
                    // In a real application, you'd need to fetch headers or a dummy file to check the size.
                    // Assuming for this example that the dummy data has valid sizes under the limit.

                    const sendUrl = `https://api.telegram.org/bot${botToken}/sendDocument`;
                    const payload = {
                        chat_id: telegram_user_id,
                        document: fileUrl,
                        caption: `📚 ${fileName}\n\nRequested from CSE Resources Portal`
                    };

                    try {
                        const res = await fetch(sendUrl, {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify(payload)
                        });

                        if (!res.ok) throw new Error("Failed to send file");
                        successCount++;
                    } catch (err) {
                        console.error("Error sending file to Telegram:", err);
                        errorCount++;
                    }
                }

                sendBtn.textContent = "Send to Telegram";

                if (errorCount === 0) {
                    showToast(`🎉 ${successCount} file(s) sent to your Telegram!`);
                } else {
                    let message = `⚠️ ${successCount} sent, ${errorCount} failed`;
                    showToast(message, "error");
                }
            }

            // Event listener for the Telegram button
            sendBtn.addEventListener('click', sendFilesToTelegram);
        });
    </script>
</body>
</html>
