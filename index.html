<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>University Resource Finder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --primary-color: #6366f1;
      --primary-hover: #4f46e5;
      --secondary-color: #f3f4f6;
      --accent-color: #10b981;
      --error-color: #ef4444;
      --warning-color: #f59e0b;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --bg-primary: #ffffff;
      --bg-secondary: #f9fafb;
      --bg-tertiary: #f3f4f6;
      --border-color: #e5e7eb;
      --shadow-light: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-medium: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --shadow-heavy: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --primary-color: #818cf8;
      --primary-hover: #6366f1;
      --secondary-color: #374151;
      --accent-color: #34d399;
      --error-color: #f87171;
      --warning-color: #fbbf24;
      --text-primary: #f9fafb;
      --text-secondary: #d1d5db;
      --bg-primary: #1f2937;
      --bg-secondary: #111827;
      --bg-tertiary: #374151;
      --border-color: #4b5563;
      --shadow-light: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
      --shadow-medium: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
      --shadow-heavy: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      transition: var(--transition);
      line-height: 1.6;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
      position: relative;
      padding: 0 15px;
    }

    .header h2 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      text-shadow: var(--shadow-light);
    }

    .header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      font-weight: 400;
      max-width: 600px;
      margin: 0 auto;
    }

    .theme-toggle {
      position: absolute;
      top: 0;
      right: 0;
      background: var(--bg-primary);
      border: 2px solid var(--border-color);
      border-radius: 50px;
      padding: 8px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-light);
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 80px;
      justify-content: center;
    }

    .theme-toggle:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-medium);
      border-color: var(--primary-color);
    }

    .theme-icon {
      font-size: 1.2rem;
      transition: var(--transition);
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: var(--bg-primary);
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: var(--shadow-heavy);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
      border-radius: 20px 20px 0 0;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '�';
      font-size: 1.2rem;
    }

    .selectors {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: '▼';
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-secondary);
      font-size: 0.8rem;
      transition: var(--transition);
    }

    .select-wrapper:hover::after {
      color: var(--primary-color);
    }

    select {
      width: 100%;
      padding: 1rem 2.5rem 1rem 1rem;
      font-size: 1rem;
      border: 2px solid var(--border-color);
      border-radius: 12px;
      background: var(--bg-primary);
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
      appearance: none;
      font-weight: 500;
    }

    select:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      transform: translateY(-2px);
    }

    select:hover {
      border-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .button-group {
      display: flex;
      gap: 1rem;
      margin: 2rem 0;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      flex: 1;
      min-width: 200px;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--primary-hover));
      color: white;
      box-shadow: var(--shadow-medium);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-heavy);
    }

    .btn-secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 2px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
      transform: translateY(-2px);
    }

    .btn-accent {
      background: linear-gradient(135deg, var(--accent-color), #059669);
      color: white;
    }

    .btn-accent:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-heavy);
    }

    .btn-error {
      background: linear-gradient(135deg, var(--error-color), #dc2626);
      color: white;
    }

    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: all 0.6s ease;
      transform: translate(-50%, -50%);
    }

    button:active::before {
      width: 300px;
      height: 300px;
    }

    #files {
      margin-top: 2rem;
      background: var(--bg-secondary);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      transition: var(--transition);
    }

    #files h3 {
      color: var(--text-primary);
      margin-bottom: 1rem;
      font-size: 1.3rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #files h3::before {
      content: '📁';
    }

    #fileList {
      max-height: 300px;
      overflow-y: auto;
      padding-right: 10px;
    }

    #fileList::-webkit-scrollbar {
      width: 8px;
    }

    #fileList::-webkit-scrollbar-track {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }

    #fileList::-webkit-scrollbar-thumb {
      background: var(--primary-color);
      border-radius: 4px;
    }

    .file-item {
      display: flex;
      align-items: center;
      margin: 0.75rem 0;
      padding: 1rem;
      background: var(--bg-primary);
      border-radius: 10px;
      transition: var(--transition);
      border: 1px solid var(--border-color);
      font-weight: 500;
    }

    .file-item:hover {
      background: var(--bg-tertiary);
      transform: translateX(5px);
      box-shadow: var(--shadow-light);
    }

    .file-icon {
      margin-right: 12px;
      font-size: 1.2rem;
      min-width: 24px;
      text-align: center;
    }

    input[type="checkbox"] {
      margin-right: 1rem;
      width: 20px;
      height: 20px;
      accent-color: var(--primary-color);
      cursor: pointer;
      flex-shrink: 0;
    }

    .file-name {
      flex-grow: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-info {
      display: flex;
      flex-direction: column;
      margin-left: 8px;
    }

    .file-type {
      font-size: 0.8rem;
      color: var(--text-secondary);
      background: var(--bg-tertiary);
      padding: 2px 8px;
      border-radius: 12px;
      margin-top: 4px;
    }

    .file-size {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .warning {
      color: var(--warning-color);
      margin-left: 8px;
    }

    #telegramSection {
      background: var(--bg-secondary);
      padding: 1.5rem;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      margin-top: 2rem;
      display: none;
    }

    .upload-area {
        background: var(--bg-secondary);
        padding: 1.5rem;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        margin-bottom: 1.5rem;
    }

    .upload-area input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px dashed var(--border-color);
        border-radius: 8px;
        background: var(--bg-primary);
        color: var(--text-primary);
    }

    #selectedFilesList {
        max-height: 200px;
        overflow-y: auto;
        padding-right: 10px;
        margin-top: 1rem;
    }

    #selectedFilesList .file-item {
        background: var(--bg-primary);
        border: 1px solid var(--border-color);
        padding: 0.75rem 1rem;
        margin-bottom: 0.5rem;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }

    #selectedFilesList .file-item .file-name {
        flex-grow: 1;
        margin-left: 10px;
    }

    #selectedFilesList .file-item .remove-file-btn {
        background: var(--error-color);
        color: white;
        border: none;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.9rem;
        cursor: pointer;
        transition: background-color 0.2s ease;
        flex-shrink: 0;
    }

    #selectedFilesList .file-item .remove-file-btn:hover {
        background: #dc2626;
    }


    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 1rem 2rem;
      border-radius: 8px;
      box-shadow: var(--shadow-heavy);
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 1000;
      transition: all 0.3s ease;
      opacity: 0;
      visibility: hidden;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
    }

    .toast.success {
      border-left: 4px solid var(--accent-color);
    }

    .toast.error {
      border-left: 4px solid var(--error-color);
    }

    .toast.warning {
      border-left: 4px solid var(--warning-color);
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 1.5rem;
      }

      .header {
        padding-top: 40px;
      }

      .header h2 {
        font-size: 2rem;
      }

      .theme-toggle {
        position: absolute;
        top: 10px;
        right: 50%;
        transform: translateX(50%);
      }

      .selectors {
        grid-template-columns: 1fr;
      }

      .button-group {
        flex-direction: column;
      }

      button {
        min-width: auto;
        width: 100%;
      }

      #files {
        padding: 1rem;
      }

      .file-item {
        padding: 0.8rem;
        flex-wrap: wrap;
      }

      .file-info {
        margin-left: 0;
        margin-top: 8px;
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
      }
    }

    @media (max-width: 480px) {
      .header h2 {
        font-size: 1.8rem;
      }

      .container {
        padding: 1rem;
      }

      .section-title {
        font-size: 1.3rem;
      }

      select {
        padding: 0.8rem 2rem 0.8rem 0.8rem;
        font-size: 0.95rem;
      }

      button {
        padding: 0.8rem 1rem;
        font-size: 1rem;
      }
    }

    @media (max-width: 360px) {
      .header h2 {
        font-size: 1.6rem;
      }

      .header p {
        font-size: 0.95rem;
      }

      .section-title {
        font-size: 1.2rem;
      }

      .file-name {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>University Resource Finder</h2>
    <p>Find your academic materials quickly and efficiently</p>
    <div class="theme-toggle" onclick="themeManager.toggle()">

  <div class="toast" id="toast"></div>

  <script>
    // Theme Management using Polymorphism
    class Theme {
      apply() {
        throw new Error("apply() method must be implemented");
      }
      
      getIcon() {
        throw new Error("getIcon() method must be implemented");
      }
    }

    class LightTheme extends Theme {
      apply() {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      }
      
      getIcon() {
        return '🌙';
      }
    }

    class DarkTheme extends Theme {
      apply() {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
      
      getIcon() {
        return '☀️';
      }
    }

    class ThemeManager {
      constructor() {
        this.lightTheme = new LightTheme();
        this.darkTheme = new DarkTheme();
        this.currentTheme = this.lightTheme;
        this.init();
      }

      init() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
          this.currentTheme = this.darkTheme;
        } else {
          this.currentTheme = this.lightTheme;
        }
        this.currentTheme.apply();
        this.updateIcon();
      }

      toggle() {
        this.currentTheme = this.currentTheme instanceof LightTheme ? 
          this.darkTheme : this.lightTheme;
        this.currentTheme.apply();
        this.updateIcon();
        
        // Add smooth transition effect
        document.body.style.transition = 'all 0.3s ease';
        setTimeout(() => {
          document.body.style.transition = '';
        }, 300);
      }

      updateIcon() {
        const icon = document.getElementById('themeIcon');
        icon.textContent = this.currentTheme.getIcon();
        
        // Add pulse animation
        icon.classList.add('pulse');
        setTimeout(() => icon.classList.remove('pulse'), 2000);
      }
    }

    const themeManager = new ThemeManager(); // Initialize themeManager globally

    // File type icons mapping
    const FILE_ICONS = {

    const tg = window.Telegram.WebApp;
    tg.expand();

    // New Telegram Bot Token and Chat ID for resource sharing

    const ADMIN_CHAT_ID = "6089812211";

    // Global array to hold selected files for sharing
    let selectedFilesToShare = [];

    // Toast notification function
    function showToast(message, type = "success") {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.classList.add("show");
      
      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    async function updateCourses() {

      const exam = document.getElementById("exam").value;
      const filetype = document.getElementById("filetype").value;
      const courseSelect = document.getElementById("course");

      }

      if (filetype === "PreviousQuestions") {

    function getFileIcon(filename) {
      const extension = filename.split('.').pop().toLowerCase();
      return FILE_ICONS[extension] || FILE_ICONS['default'];
    }

    function formatFileSize(bytes) {
      if (bytes < 1024) return bytes + ' bytes';
      else if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
      else return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function getFileType(filename) {
      const extension = filename.split('.').pop().toUpperCase();
      return extension || 'File';
    }

    async function fetchFiles() {
      const semester = document.getElementById("semester").value;
      const exam = document.getElementById("exam").value;
      const course = document.getElementById("course").value;
      const filetype = document.getElementById("filetype").value;
      const fileListDiv = document.getElementById("fileList");
      const telegramDiv = document.getElementById("telegramSection");
      const searchBtn = document.getElementById("searchText");
      
      // Show loading state
      searchBtn.innerHTML = '<span class="loading"></span> Searching...';
      fileListDiv.innerHTML = '<p style="color: var(--text-secondary);">🔍 Searching for resources...</p>';
      telegramDiv.style.display = "none";

      if (!semester || !exam || !course || !filetype) {
        showToast("Please select all fields to continue", "error");
        searchBtn.textContent = "Search Resources";
        fileListDiv.innerHTML = '<p style="color: var(--text-secondary); font-style: italic;">⚠️ Please select all preferences above</p>';
        return;
      }

      let apiUrl;
      if (filetype === "PreviousQuestions") {
        apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${semester}/PreviousQuestions/${exam}`;
      } else {
        apiUrl = `https://api.github.com/repos/${GITHUB_USERNAME}/${REPO_NAME}/contents/${semester}/${exam}/${course}/${filetype}`;
      }

      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error("Path not found or no files.");
        const files = await res.json();

        if (!Array.isArray(files)) throw new Error("No files found.");

        fileListDiv.innerHTML = "";
        let fileCount = 0;

        files.forEach(file => {
          if (file.type === "file") {
            const fileItem = document.createElement("div");
            fileItem.className = "file-item fade-in";
            
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.value = file.download_url;
            checkbox.dataset.name = file.name;
            checkbox.dataset.size = file.size;
            
            const fileIcon = document.createElement("span");
            fileIcon.className = "file-icon";
            fileIcon.textContent = getFileIcon(file.name);
            
            const fileName = document.createElement("span");
            fileName.className = "file-name";
            fileName.textContent = file.name;
            
            const fileInfo = document.createElement("div");
            fileInfo.className = "file-info";
            
            const fileType = document.createElement("span");
            fileType.className = "file-type";
            fileType.textContent = getFileType(file.name);
            
            const fileSize = document.createElement("span");
            fileSize.className = "file-size";
            fileSize.textContent = formatFileSize(file.size);
            
            // Add warning for large files
            if (file.size > 20 * 1024 * 1024) {
              const warning = document.createElement("span");
              warning.className = "warning";
              warning.textContent = "⚠️ Large file";
              fileInfo.appendChild(warning);
            }
            
            fileInfo.appendChild(fileType);
            fileInfo.appendChild(fileSize);
            
            fileItem.appendChild(checkbox);
            fileItem.appendChild(fileIcon);
            fileItem.appendChild(fileName);
            fileItem.appendChild(fileInfo);
            
            fileListDiv.appendChild(fileItem);
            fileCount++;
          }
        });

        if (fileCount > 0) {
          telegramDiv.style.display = "flex";
          telegramDiv.classList.add("fade-in");
          fileListDiv.innerHTML += `<p style="color: var(--accent-color); font-weight: 600; margin-top: 1rem;">✅ Found ${fileCount} file(s)</p>`;
        } else {
          fileListDiv.innerHTML += "<p style='color: var(--text-secondary);'>📭 No files found for the selected combination.</p>";
        }

      } catch (err) {
        fileListDiv.innerHTML += `<p style='color: var(--error-color);'>❌ ${err.message || "No files found for the selected combination."}</p>`;
        console.error(err);
      }

      searchBtn.textContent = "Search Resources";
    }

    function selectAllFiles() {
      const checkboxes = document.querySelectorAll('#fileList input[type="checkbox"]');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);
      
      checkboxes.forEach(cb => {
        cb.checked = !allChecked;
        // Add visual feedback
        cb.closest('.file-item').style.backgroundColor = cb.checked ? 
          'var(--bg-tertiary)' : 
          'var(--bg-primary)';
      });
      
      showToast(allChecked ? "All files deselected" : "All files selected");
    }

    async function sendSelectedToTelegram() {
      const selected = Array.from(document.querySelectorAll('#fileList input[type="checkbox"]:checked'));
      const telegramBtn = document.getElementById("telegramText");
      
      if (selected.length === 0) {
        showToast("Please select at least one file to send", "error");
        return;
      }

      telegramBtn.innerHTML = '<span class="loading"></span> Sending...';
      
      const user_id = window.Telegram.WebApp.initDataUnsafe?.user?.id;
      const botToken = "7864007481:AAGxgH0CVpZD9Dp0Yc4v91LqNcZTEdoRwak"; // This is the original bot token for fetching

      let successCount = 0;
      let errorCount = 0;
      let largeFileCount = 0;

      for (const checkbox of selected) {
        const fileUrl = checkbox.value;
        const fileName = checkbox.dataset.name;
        const fileSize = parseInt(checkbox.dataset.size);

        // Skip files larger than 20MB
        if (fileSize > 20 * 1024 * 1024) {
          largeFileCount++;
          errorCount++;
          continue;
        }

        const sendUrl = `https://api.telegram.org/bot${botToken}/sendDocument`;
        const payload = {
          chat_id: user_id,
          document: fileUrl,
          caption: `📚 ${fileName}\n\nRequested from University Resource Finder`
        };

        try {
          const res = await fetch(sendUrl, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          });

          if (!res.ok) throw new Error("Failed to send file");
          successCount++;

        } catch (err) {
          console.error("Error sending file to Telegram:", err);
          errorCount++;
        }
      }

      telegramBtn.textContent = "Get on Telegram";
      
      if (errorCount === 0) {
        showToast(`🎉 ${successCount} file(s) sent to your Telegram!`);
      } else {
        let message = `⚠️ ${successCount} sent, ${errorCount} failed`;
        if (largeFileCount > 0) {
          message += ` (${largeFileCount} large files skipped)`;
        }
        showToast(message, "error");
      }
    }

    // Function to update courses for the share section (similar to fetchFiles)

    // Event listeners for share selects to update courses
    document.getElementById("shareSemester").addEventListener("change", updateShareCourses);
    document.getElementById("shareExam").addEventListener("change", updateShareCourses);
    document.getElementById("shareFileType").addEventListener("change", updateShareCourses);

    // Function to handle file input change and display preview
    document.getElementById("fileUpload").addEventListener("change", function() {
        const newFiles = Array.from(this.files); // Get newly selected files as an array

        // Add new files to selectedFilesToShare, avoiding duplicates by name and size
        newFiles.forEach(newFile => {
            const isDuplicate = selectedFilesToShare.some(existingFile => 
                existingFile.name === newFile.name && existingFile.size === newFile.size
            );
            if (!isDuplicate) {
                selectedFilesToShare.push(newFile);
            }
        });

        // Clear the file input's value to allow selecting the same files again (important for 'change' event to fire)
        this.value = ''; 

        renderSelectedFilesList(); // Call a new function to render the list
    });

    // Function to render the list of selected files for sharing
    function renderSelectedFilesList() {
        const selectedFilesListDiv = document.getElementById("selectedFilesList");
        selectedFilesListDiv.innerHTML = ""; // Clear previous list

        if (selectedFilesToShare.length === 0) {
            selectedFilesListDiv.innerHTML = '<p style="color: var(--text-secondary); margin-top: 1rem;">No files selected.</p>';
            return;
        }

        selectedFilesToShare.forEach((file, index) => {
            const fileItem = document.createElement("div");
            fileItem.className = "file-item";
            
            const fileIcon = document.createElement("span");
            fileIcon.className = "file-icon";
            fileIcon.textContent = getFileIcon(file.name);
            
            const fileName = document.createElement("span");
            fileName.className = "file-name";
            fileName.textContent = file.name;

            const fileSizeSpan = document.createElement("span");
            fileSizeSpan.className = "file-size";
            fileSizeSpan.textContent = formatFileSize(file.size);

            const removeButton = document.createElement("button");
            removeButton.className = "remove-file-btn";
            removeButton.textContent = "X";
            // Use a closure to capture the current file object for removal
            removeButton.onclick = function() {
                removeFileFromSelection(file); 
            };

            fileItem.appendChild(fileIcon);
            fileItem.appendChild(fileName);
            fileItem.appendChild(fileSizeSpan);
            fileItem.appendChild(removeButton);
            selectedFilesListDiv.appendChild(fileItem);
        });
    }

    // Function to remove a file from the selectedFilesToShare array and update the UI
    function removeFileFromSelection(fileToRemove) {
        // Find the index of the file to remove
        const indexToRemove = selectedFilesToShare.findIndex(file => 
            file.name === fileToRemove.name && file.size === fileToRemove.size && file.lastModified === fileToRemove.lastModified
        );

        if (indexToRemove > -1) {
            const removedFileName = selectedFilesToShare[indexToRemove].name;
            selectedFilesToShare.splice(indexToRemove, 1); // Remove from array
            renderSelectedFilesList(); // Re-render the list after removal
            showToast(`"${removedFileName}" removed from selection.`);
        }
    }

    async function shareResources() {
        const semester = document.getElementById("shareSemester").value;
        const exam = document.getElementById("shareExam").value;
        const filetype = document.getElementById("shareFileType").value;
        const course = document.getElementById("shareCourse").value;
        const files = selectedFilesToShare; // Use the global array
        const shareBtn = document.getElementById("shareText");

        if (!semester || !exam || !filetype || !course || files.length === 0) {
            showToast("Please select all fields and at least one file to share", "error");
            return;
        }

        shareBtn.innerHTML = '<span class="loading"></span> Sharing...';

        const user = window.Telegram.WebApp.initDataUnsafe?.user;
        const username = user?.username ? `@${user.username}` : user?.first_name || "Anonymous User";
        const userId = user?.id || "N/A";

        let successUploadCount = 0;
        let failedUploadCount = 0;
        let largeFileSkippedCount = 0;

        console.log(`Attempting to share ${files.length} file(s).`);

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            console.log(`Processing file ${i + 1}/${files.length}: ${file.name} (${file.size} bytes)`);

            // Telegram Bot API has a 50MB limit for sendDocument
            const TELEGRAM_MAX_FILE_SIZE = 50 * 1024 * 1024; 
            if (file.size > TELEGRAM_MAX_FILE_SIZE) {
                console.warn(`File ${file.name} (${formatFileSize(file.size)}) is too large for Telegram (max ${formatFileSize(TELEGRAM_MAX_FILE_SIZE)}). Skipping.`);
                showToast(`Skipped "${file.name}" (too large)`, "warning");
                largeFileSkippedCount++;
                failedUploadCount++; // Count as a failed attempt for summary
                continue;
            }

            const formData = new FormData();
            formData.append("chat_id", ADMIN_CHAT_ID);
            formData.append("document", file);
            formData.append("caption", `📤 New Resource Shared!\n\n**Category:** ${semester} > ${exam} > ${course} > ${filetype}\n**File Name:** ${file.name}\n**Shared By:** ${username} (ID: ${userId})`);

            try {
                const res = await fetch(`https://api.telegram.org/bot${SHARE_BOT_TOKEN}/sendDocument`, {
                    method: "POST",
                    body: formData
                });

                if (!res.ok) {
                    const errorData = await res.json();
                    throw new Error(`Failed to send file ${file.name}: ${errorData.description || res.statusText}`);
                }
                successUploadCount++;
                console.log(`Successfully sent file: ${file.name}`);
            } catch (err) {
                console.error(`Error sending shared file "${file.name}" to Telegram:`, err);
                showToast(`Error sharing "${file.name}": ${err.message}`, "error");
                failedUploadCount++;
            }
        }

        shareBtn.textContent = "Share Resources";

        if (failedUploadCount === 0) {
            showToast(`🎉 Successfully shared ${successUploadCount} file(s)! Thank you!`, "success");
        } else {
            let message = `⚠️ Shared ${successUploadCount} file(s), but ${failedUploadCount} failed to upload.`;
            if (largeFileSkippedCount > 0) {
                message += ` (${largeFileSkippedCount} file(s) skipped due to size)`;
            }
            showToast(message, "warning");
        }

        // Clear the form after attempt (whether fully successful or not)
        document.getElementById("shareSemester").value = "";
        document.getElementById("shareExam").value = "";
        document.getElementById("shareFileType").value = "";
        document.getElementById("shareCourse").innerHTML = '<option value="">-- Select Course --</option>';
        document.getElementById("fileUpload").value = ""; // Clear selected files
        document.getElementById("selectedFilesList").innerHTML = '<p style="color: var(--text-secondary); margin-top: 1rem;">No files selected.</p>'; // Clear selected files preview
        selectedFilesToShare = []; // Clear global array
    }

    // Add smooth scroll behavior
    document.querySelectorAll('select, button').forEach(element => {
      element.addEventListener('focus', () => {
        element.scrollIntoView({ behavior: 'smooth', block: 'center' });
      });
    });
  </script>
